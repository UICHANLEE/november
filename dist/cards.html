<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f2f0e9"><title>운영자용 미션 QR 코드</title><link rel="stylesheet" href="style.css"></head>
<body><div class="cards-wrap"><header class="site-header"><a class="brand" href="./" aria-label="미션 스캔 홈"><span class="brand-mark" aria-hidden="true">M<span>.</span></span><span>MISSION<br>SCAN</span></a><a class="back" href="./">← 스캐너로 돌아가기</a></header><main class="organizer"><div class="cards-head"><div><p class="eyebrow"><span class="eyebrow-number">FIELD KIT</span> FOR THE ORGANIZER</p><h1>미션 QR 코드<span>.</span></h1><p>난이도별 5개, 총 15개의 QR 코드입니다.<br>인쇄해서 원하는 장소에 붙여 주세요.</p></div><button class="primary print-btn" onclick="window.print()">QR 코드 인쇄하기 <span aria-hidden="true">↗</span></button></div><p class="hint"><strong>안내</strong> 참가자에게 난이도를 숨기려면 QR 이미지 부분만 오려서 사용하세요.</p><div id="groups"></div></main><footer class="site-footer"><span>MISSION SCAN / <strong>FIELD KIT</strong></span><a href="./">스캐너로 돌아가기 ↗</a></footer></div><script>
const groups=document.getElementById('groups');for(let level=1;level<=3;level++){const section=document.createElement('section');section.className='group';const heading=document.createElement('h2');heading.textContent=`난이도 ${level} · 5개`;section.appendChild(heading);const grid=document.createElement('div');grid.className='grid';for(let i=1;i<=5;i++){const id=`${level}-${String(i).padStart(2,'0')}`;const card=document.createElement('div');card.className='qr-card';const img=document.createElement('img');img.src=`qr/${id}.svg`;img.alt=`난이도 ${level}, QR ${i}`;const label=document.createElement('p');label.textContent=`${id}`;card.append(img,label);grid.appendChild(card)}section.appendChild(grid);groups.appendChild(section)}
</script></body></html>
