<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>운영자용 미션 QR 코드</title><link rel="stylesheet" href="style.css"><style>
.cards-wrap{max-width:1000px;margin:auto;padding:35px 35px 70px}.cards-head{display:flex;align-items:start;justify-content:space-between;gap:20px}.cards-head h1{font-size:34px;margin:12px 0}.cards-head p{font-size:14px;color:#788173;line-height:1.8}.print-btn{width:auto;padding:0 22px;gap:20px;white-space:nowrap}.back{font-size:12px;color:#667d5a;text-decoration:none}.group{margin-top:48px}.group h2{font-size:18px;border-bottom:1px solid #d9dbd1;padding-bottom:12px}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:13px}.qr-card{background:white;border:1px solid #e3e6dc;border-radius:10px;text-align:center;padding:18px 10px}.qr-card img{width:100%;max-width:160px;display:block;margin:auto}.qr-card p{font-size:12px;font-weight:700;color:#52684a;margin:8px 0 0}.hint{font-size:12px;color:#899184}@media(max-width:700px){.cards-head{display:block}.print-btn{margin-top:18px}.grid{grid-template-columns:repeat(2,1fr)}.cards-wrap{padding:25px 20px}.group{margin-top:35px}}@media print{body{background:white}.cards-wrap{max-width:none;padding:0}.back,.print-btn,.hint,.cards-head p{display:none}.cards-head h1{font-size:20px}.group{margin-top:18px;break-inside:avoid}.group h2{font-size:13px}.grid{grid-template-columns:repeat(5,1fr);gap:5px}.qr-card{border:1px solid #bbb;padding:5px;break-inside:avoid}.qr-card img{width:100%;max-width:115px}.qr-card p{font-size:10px;margin:0}}
</style></head><body><div class="cards-wrap"><a class="back" href="./">← 스캐너로 돌아가기</a><div class="cards-head"><div><p class="eyebrow">FOR THE ORGANIZER</p><h1>미션 QR 코드</h1><p>난이도별 5개, 총 15개의 QR 코드입니다.<br>인쇄해서 원하는 장소에 붙여 주세요.</p></div><button class="primary print-btn" onclick="window.print()">QR 코드 인쇄하기 <span>↗</span></button></div><p class="hint">이 페이지에는 난이도가 표시됩니다. 참가자에게 난이도를 숨기려면 QR 이미지 부분만 오려서 사용하세요.</p><div id="groups"></div></div><script>
const groups=document.getElementById('groups');for(let level=1;level<=3;level++){const section=document.createElement('section');section.className='group';const heading=document.createElement('h2');heading.textContent=`난이도 ${level} · 5개`;section.appendChild(heading);const grid=document.createElement('div');grid.className='grid';for(let i=1;i<=5;i++){const id=`${level}-${String(i).padStart(2,'0')}`;const card=document.createElement('div');card.className='qr-card';const img=document.createElement('img');img.src=`qr/${id}.svg`;img.alt=`난이도 ${level}, QR ${i}`;const label=document.createElement('p');label.textContent=`${id}`;card.append(img,label);grid.appendChild(card)}section.appendChild(grid);groups.appendChild(section)}
</script></body></html>
