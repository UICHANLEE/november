<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f8f7ed"><title>운영자용 QR 코드 — 메챠카멜레온</title><link rel="stylesheet" href="style.css"></head>
<body><div class="cards-wrap"><header class="site-header"><a class="brand" href="./" aria-label="Young Creater Crew 홈"><span class="brand-mark" aria-hidden="true">Y<span>✳</span></span><span>YOUNG CREATER<br>CREW</span></a><a class="back" href="admin.html">← 관리자 페이지로</a></header><main class="organizer"><div class="cards-head"><div><p class="eyebrow"><span class="eyebrow-number">FIELD KIT</span> YOUNG CREATER CREW</p><h1>미션 QR 코드<span>.</span></h1><p>난이도별 5개, 총 15개의 QR 코드입니다.<br>인쇄해서 원하는 장소에 붙여 주세요.</p></div><button class="primary print-btn" onclick="window.print()">QR 코드 인쇄하기 <span aria-hidden="true">↗</span></button></div><p class="hint"><strong>안내</strong> 참가자에게 난이도를 숨기려면 QR 이미지 부분만 오려서 사용하세요.</p><p id="cards-feedback" class="feedback" role="status">관리자 권한을 확인하고 있습니다.</p><div id="groups"></div></main><footer class="site-footer"><span>YOUNG CREATER CREW / <strong>FIELD KIT</strong></span><a href="./">스캐너로 돌아가기 ↗</a></footer></div><script>
(async()=>{const feedback=document.getElementById('cards-feedback');const password=sessionStorage.getItem('mission-admin');if(!password){feedback.textContent='QR 코드를 보려면 관리자 페이지에서 로그인해 주세요.';return}try{const response=await fetch('/api/mission',{method:'POST',headers:{'Content-Type':'application/json','X-Admin-Password':password},body:JSON.stringify({action:'cards'})});if(!response.ok)throw new Error();const {cards}=await response.json();const groups=document.getElementById('groups');for(let level=1;level<=3;level++){const section=document.createElement('section');section.className='group';const heading=document.createElement('h2');heading.textContent=`난이도 ${level} · 5개`;section.appendChild(heading);const grid=document.createElement('div');grid.className='grid';for(const item of cards.filter(c=>c.level===level)){const card=document.createElement('div');card.className='qr-card';const img=document.createElement('img');img.src=URL.createObjectURL(new Blob([item.svg],{type:'image/svg+xml'}));img.alt=`난이도 ${level}, QR ${item.id}`;const label=document.createElement('p');label.textContent=item.id;card.append(img,label);grid.appendChild(card)}section.appendChild(grid);groups.appendChild(section)}feedback.textContent=''}catch(e){feedback.textContent='QR 코드를 불러오지 못했어요. 관리자 페이지에서 다시 로그인해 주세요.'}})();
</script></body></html>
